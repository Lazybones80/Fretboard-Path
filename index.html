<style>

*{box-sizing:border-box}

button{cursor:pointer}
.app{min-height:100vh}

.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#071018;font-weight:900;font-size:22px;box-shadow:0 8px 22px rgba(110,231,200,.18)}

.pill{padding:7px 11px;font-size:12px;color:var(--muted)}.icon-btn{width:38px;height:38px;display:grid;place-items:center}.primary,.secondary,.ghost{padding:10px 14px;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#071018}.secondary{background:var(--accent2);border-color:var(--accent2);color:white}.ghost{background:transparent;color:var(--muted)}button:hover{filter:brightness(1.08)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:2px}

main{min-width:0}.view{display:none}.view.active{display:block}.hero{padding:28px;border-radius:var(--radius);background:radial-gradient(circle at 85% 15%,rgba(123,168,255,.2),transparent 34%),radial-gradient(circle at 0% 100%,rgba(110,231,200,.12),transparent 38%),var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}.hero h2{font-size:clamp(27px,4vw,46px);line-height:1.03;letter-spacing:-.045em;margin:8px 0 10px;max-width:760px}.hero p{max-width:760px;color:var(--muted);font-size:16px;margin:0}.hero-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.eyebrow2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}.grid{display:grid;gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.card h3,.card h4{margin:0 0 7px;letter-spacing:-.02em}.card p{color:var(--muted);margin:4px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:25px 0 12px}.section-head h3{margin:0;font-size:21px}.section-head p{margin:0;color:var(--muted);font-size:13px}.stat{font-size:30px;font-weight:900;letter-spacing:-.05em}.small{font-size:12px;color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;background:var(--panel3);border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--muted)}
.progress-track{height:9px;border-radius:99px;background:var(--panel3);overflow:hidden;margin:12px 0 4px}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.session-list{display:grid;gap:10px}.session-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);text-align:left}.session-card.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--panel))}.check{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:var(--panel3);color:transparent;display:grid;place-items:center;font-weight:900}.done .check{background:var(--accent);border-color:var(--accent);color:#071018}.session-title{display:inline-block;margin-right:4px;font-weight:800;color:var(--accent2)}.session-detail{font-size:13px;color:var(--muted)}.minutes{font-size:12px;color:var(--gold);font-weight:900}
.phase-list{display:grid;gap:12px}.phase{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}.phase-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}.phase-head h3{margin:0;font-size:17px}.phase-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.phase-body{display:none;border-top:1px solid var(--line);padding:15px 18px}.phase.open .phase-body{display:block}.phase-toggle{color:var(--accent);font-weight:900;font-size:18px}.module-list{display:grid;gap:8px}.module{display:flex;align-items:flex-start;gap:10px;padding:11px;border-radius:12px;background:var(--panel2);border:1px solid transparent}.module:hover{border-color:var(--line)}.module input{accent-color:var(--accent);margin-top:3px;width:17px;height:17px}.module strong{display:block}.module span{display:block;color:var(--muted);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:15px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);margin-bottom:14px}.select-wrap{display:grid;gap:5px;min-width:135px}.select-wrap label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.09em}.select-wrap select{padding:9px 11px;border-radius:11px;background:var(--panel2);min-height:40px;min-width:0;width:100%;cursor:ns-resize}
.fretboard-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:12px;box-shadow:var(--shadow)}.fretboard{min-width:720px}.fret-header,.fret-row{display:grid;align-items:center}.fret-header{grid-template-columns:repeat(var(--fret-count),minmax(48px,1fr));margin-left:50px;color:var(--muted);font-size:11px;text-align:center}.fret-row{grid-template-columns:50px repeat(var(--fret-count),minmax(48px,1fr));min-height:58px;border-top:1px solid var(--line);position:relative}.fret-row:first-of-type{border-top:0}.string-label{font-size:12px;color:var(--muted);font-weight:900;text-align:center}.fret-cell{height:58px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);position:relative}.fret-cell.nut{border-left:4px solid var(--gold)}.fret-dot{position:absolute;bottom:3px;width:5px;height:5px;background:var(--line);border-radius:50%}.fret-note{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;line-height:1;border:1px solid transparent;position:relative;z-index:2}.fret-note.root{background:var(--accent);color:#071018;border-color:var(--accent)}.fret-note.scale{background:color-mix(in srgb,var(--accent2) 32%,var(--panel2));color:var(--text);border-color:var(--accent2)}.fret-note.triad{background:var(--gold);color:#1a1203;border-color:var(--gold)}.fret-note.interval{background:var(--panel3);color:var(--text);border-color:var(--accent)}.fret-note.muted{opacity:.18}.fret-note.degree{border-radius:12px}.fret-note .sub{font-size:18px;opacity:.75}.fret-note.bass{box-shadow:0 0 0 3px var(--accent2),0 0 20px color-mix(in srgb,var(--accent2) 50%,transparent)}.fret-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.legend-dot{width:12px;height:12px;border-radius:50%}.pattern-note{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--panel2);color:var(--muted);font-size:13px}
.recall-box{display:grid;gap:12px;min-height:170px;align-content:center;text-align:center}.recall-prompt{font-size:23px;font-weight:900;letter-spacing:-.02em}.answer{padding:13px;border-radius:12px;background:var(--panel2);color:var(--accent);font-weight:800}.hidden{display:none}
.tech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tech-card{padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.tech-card .tech-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.tech-card h4{margin:0}.tech-card ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px}.filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{padding:7px 11px;background:transparent;color:var(--muted);font-size:12px}.chip.active{background:var(--accent);color:#071018;border-color:var(--accent)}
.review-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.review-row:last-child{border-bottom:0}.review-label{font-weight:800}.review-meta{font-size:12px;color:var(--muted)}.review-actions{display:flex;gap:6px}.review-actions button{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;transition:background .18s,border-color .18s,color .18s,transform .18s}.review-actions button.good{color:#071018;background:var(--accent);border-color:var(--accent)}.review-actions button.selected{font-weight:900;transform:translateY(-1px);box-shadow:0 0 0 2px color-mix(in srgb,var(--text) 18%,transparent)}.review-actions button.selected[data-level="Again"]{background:color-mix(in srgb,var(--red) 24%,var(--panel2));border-color:var(--red);color:var(--text)}.review-actions button.selected[data-level="Soon"]{background:color-mix(in srgb,var(--accent2) 24%,var(--panel2));border-color:var(--accent2);color:var(--text)}.review-actions button.selected[data-level="Solid"]{background:var(--accent);border-color:var(--accent);color:#071018}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:12px}.note-box{border-left:3px solid var(--gold);padding:10px 13px;background:var(--panel2);color:var(--muted);border-radius:0 12px 12px 0;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding-top:12px}.side-nav{position:sticky;top:76px;z-index:10;display:flex;gap:6px;overflow:auto;padding:7px}.nav-label,.nav-foot{display:none}.nav-btn{flex:1;justify-content:center;min-width:92px;margin:0;padding:9px 7px;font-size:11px;gap:5px;white-space:nowrap}.nav-icon{width:auto}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.topbar{padding:10px 12px;gap:10px}.brand{gap:10px;min-width:0}.brand>div:last-child{min-width:0}.brand-mark{width:36px;height:36px}.brand h1{font-size:17px}.eyebrow{font-size:9px;letter-spacing:.14em;white-space:nowrap}.header-actions{gap:6px;flex-shrink:0}.pill{font-size:11px;padding-inline:9px}.hero{padding:21px}.hero h2{font-size:31px}.grid.two,.grid.three,.tech-grid{grid-template-columns:1fr}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .wide{grid-column:1/-1}.select-wrap{min-width:0}.section-head{align-items:flex-start;flex-direction:column}.session-card{grid-template-columns:auto minmax(0,1fr);align-items:start}.session-card>span:nth-child(2){min-width:0}.minutes{grid-column:2;justify-self:end}.fretboard-wrap{margin-inline:-4px;padding:8px}.fretboard{min-width:650px}.fret-row{grid-template-columns:38px repeat(var(--fret-count),minmax(43px,1fr))}.fret-header{grid-template-columns:repeat(var(--fret-count),minmax(43px,1fr));margin-left:38px}.fret-note{width:34px;height:34px;font-size:20px}.fret-note .sub{font-size:16px}.card{padding:15px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">⌁</div>
      <div><div class="eyebrow">DAILY GUITAR SYSTEM</div><h1>Fretboard Path</h1></div>
    </div>
    <div class="header-actions"><span class="pill" id="streakPill">0 day streak</span><button class="icon-btn" id="themeBtn" title="Toggle theme">☼</button></div>
  </header>
  <div class="shell">
    <aside class="side-nav">
      <div class="nav-label">Practice room</div>
      <button class="nav-btn active" data-view="today"><span class="nav-icon">◷</span>Today</button>
      <button class="nav-btn" data-view="map"><span class="nav-icon">⌘</span>Curriculum</button>
      <button class="nav-btn" data-view="fretboard"><span class="nav-icon">▦</span>Fretboard lab</button>
      <button class="nav-btn" data-view="techniques"><span class="nav-icon">◉</span>Techniques</button>
      <button class="nav-btn" data-view="review"><span class="nav-icon">↺</span>Review</button>
      <button class="nav-btn" data-view="progress"><span class="nav-icon">↗</span>Progress</button>
      <div class="nav-foot">C major is the reference key. Learn the pattern, recall it, then move it through the neck.</div>
    </aside>
    <main>
      <section class="view active" id="todayView"></section>
      <section class="view" id="mapView"></section>
      <section class="view" id="fretboardView"></section>
      <section class="view" id="techniquesView"></section>
      <section class="view" id="reviewView"></section>
      <section class="view" id="progressView"></section>
    </main>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" hidden>

    DAILY_BLOCKS.forEach(function(x){items.push({id:"daily:"+x.id,label:x.title,meta:"Daily block",type:"daily"})});
    PHASES.forEach(function(p,pi){p.items.slice(0,2).forEach(function(it){items.push({id:"module:"+pi+"-"+it[0],label:it[0],meta:p.title,type:"module"})})});
    var html='<div class="hero"><div class="eyebrow2">REVIEW AND RECALL</div><h2>Bring weak material back before it fades.</h2><p>Use this page when you want a focused retrieval session. A review is complete when you can recall the idea without looking at the answer.</p><div class="hero-row"><button class="primary" id="reviewRandom">Random recall challenge</button><button class="ghost" id="clearReview">Clear review marks</button></div></div><div class="card"><div id="reviewList"></div></div>';
    document.getElementById("reviewView").innerHTML=html;var list=document.getElementById("reviewList");
    items.forEach(function(it){var level=state.review[it.id]||"Due";var row=document.createElement("div");row.className="review-row";var reviewButton=function(label){return '<button class="'+(label==="Solid"?"good ":"")+(level===label?"selected":"")+'" data-review="'+it.id+'" data-level="'+label+'" aria-pressed="'+(level===label)+'">'+label+'</button>'};row.innerHTML='<div><div class="review-label">'+esc(it.label)+'</div><div class="review-meta">'+esc(it.meta)+' · '+level+'</div></div><div class="review-actions">'+reviewButton("Again")+reviewButton("Soon")+reviewButton("Solid")+'</div>';list.appendChild(row)});
    document.querySelectorAll("[data-review]").forEach(function(b){b.addEventListener("click",function(){state.review[b.dataset.review]=b.dataset.level;saveState();renderReview()})});
    document.getElementById("reviewRandom").addEventListener("click",function(){makePrompt()});document.getElementById("clearReview").addEventListener("click",function(){state.review={};saveState();renderReview()});
  }
  function renderProgress(){
    var total=PHASES.reduce(function(n,p){return n+p.items.length},0),done=Object.keys(state.curriculum).filter(function(k){return state.curriculum[k]}).length, daily=DAILY_BLOCKS.filter(function(x){return isDone("daily:"+x.id)}).length;
    var html='<div class="hero"><div class="eyebrow2">PROGRESS</div><h2>Track consistency, then deepen the weak links.</h2><p>Your progress is stored in this browser. Use export regularly if you want a portable backup.</p></div><div class="grid three"><div class="card"><div class="small">Curriculum lessons</div><div class="stat">'+done+'/'+total+'</div><div class="progress-track"><div class="progress-fill" style="width:'+percent(done,total)+'%"></div></div><div class="small">'+percent(done,total)+'% checked</div></div><div class="card"><div class="small">Today’s blocks</div><div class="stat">'+daily+'/'+DAILY_BLOCKS.length+'</div><div class="progress-track"><div class="progress-fill" style="width:'+percent(daily,DAILY_BLOCKS.length)+'%"></div></div><div class="small">'+(state.streak||0)+' day streak</div></div><div class="card"><div class="small">Saved ideas</div><div class="stat">'+(state.notes?1:0)+'</div><div class="small">Keep adding to your riff and songwriting notebook.</div></div></div><div class="section-head"><div><h3>Data controls</h3><p>Keep your work safe when moving between devices.</p></div></div><div class="card"><div class="hero-row" style="margin-top:0"><button class="primary" id="exportBtn">Export progress</button><button class="secondary" id="importBtn">Import progress</button><button class="ghost" id="resetBtn">Reset all progress</button></div><div class="small" style="margin-top:12px">Export creates a JSON backup containing your curriculum checks, review marks, settings and notes.</div></div><div class="section-head"><div><h3>Practice philosophy</h3></div></div><div class="card"><div class="note-box">A pattern becomes useful when you can recall it in more than one place, connect it to a chord or progression, hear its function, and use it to make a musical decision.</div></div>';
    document.getElementById("progressView").innerHTML=html;
    document.getElementById("exportBtn").addEventListener("click",exportData);document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click()});document.getElementById("resetBtn").addEventListener("click",function(){if(confirm("Reset saved progress and notes?")){localStorage.removeItem("fretboardPathState");location.reload()}});
  }
  function exportData(){var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="fretboard-path-progress-"+todayKey()+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},500)}
  document.getElementById("importFile").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var incoming=JSON.parse(reader.result);state=Object.assign(state,incoming);saveState();renderAll();alert("Progress imported.")}catch(err){alert("That file could not be read.")}};reader.readAsText(file)});
  function showView(name){document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("active",v.id===name+"View")});document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.toggle("active",b.dataset.view===name)});if(name==="today")renderToday();if(name==="map")renderMap();if(name==="fretboard")renderFretboard();if(name==="techniques")renderTechniques();if(name==="review")renderReview();if(name==="progress")renderProgress();window.scrollTo({top:0,behavior:"smooth"})}
  document.querySelectorAll(".nav-btn").forEach(function(b){b.addEventListener("click",function(){showView(b.dataset.view)})});
  document.getElementById("themeBtn").addEventListener("click",function(){state.theme=state.theme==="light"?"dark":"light";document.documentElement.classList.toggle("light",state.theme==="light");saveState()});
  function renderAll(){updateHeader();renderToday();renderMap();renderFretboard();renderTechniques();renderReview();renderProgress()}
  document.addEventListener("wheel",function(event){
    var select=event.target&&event.target.closest?event.target.closest("select"):null;
    if(!select||select.disabled||!select.options.length||event.deltaY===0)return;
    event.preventDefault();
    var direction=event.deltaY>0?1:-1,count=select.options.length,index=select.selectedIndex<0?0:select.selectedIndex;
    select.selectedIndex=(index+direction+count)%count;
    select.dispatchEvent(new Event("change",{bubbles:true}));
  },{passive:false});
  loadState();renderAll();
})();
</script>
</body>
</html>
